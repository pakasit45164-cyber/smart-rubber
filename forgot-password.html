<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กู้คืนรหัสผ่าน - Smart Rubber</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ฟอนต์ภาษาไทย -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; }
        /* ธีมพื้นหลัง 3D ธรรมชาติสวนยาง */
        .bg-3d-nature {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-3d-nature min-h-screen flex flex-col items-center justify-center p-4 text-gray-800">

    <!-- Container กล่อง Forgot Password (Glassmorphism โปร่งแสงพรีเมียม) -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-xl rounded-3xl p-6 md:p-8 shadow-2xl overflow-hidden border border-white/20">
        
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="inline-flex bg-[#1b5e20] p-3.5 rounded-2xl text-white shadow-lg mb-2">
                <i class="fa-solid fa-key text-2xl"></i>
            </div>
            <h1 class="font-bold text-xl md:text-2xl text-gray-800 leading-tight">กู้คืนรหัสผ่าน</h1>
            <p id="sub-title" class="text-xs md:text-sm text-gray-500 mt-1">กรอกเบอร์โทรศัพท์ที่ใช้ลงทะเบียนเพื่อรับรหัสยืนยัน</p>
        </div>

        <!-- ขั้นที่ 1: ฟอร์มกรอกเบอร์โทรเพื่อขอ OTP -->
        <form id="step1-form" onsubmit="sendOTP(event)" class="space-y-4">
            <div>
                <label class="text-xs md:text-sm text-gray-600 mb-1.5 block font-medium">เบอร์โทรศัพท์มือถือ</label>
                <div class="relative">
                    <input type="tel" id="resetPhone" placeholder="0812345678" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3.5 pl-12 text-sm md:text-base text-gray-800 focus:outline-none focus:ring-2 focus:ring-green-600">
                    <i class="fa-solid fa-phone absolute left-4 top-4 text-gray-400 text-base"></i>
                </div>
            </div>

            <button type="submit" class="w-full bg-[#1b5e20] text-white py-4 rounded-2xl font-semibold shadow-lg hover:bg-green-700 transition cursor-pointer text-base mt-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> ส่งรหัสยืนยัน (OTP)
            </button>
        </form>

        <!-- ขั้นที่ 2: ฟอร์มกรอก OTP และเปลี่ยนรหัสใหม่ (ซ่อนไว้ก่อน) -->
        <form id="step2-form" onsubmit="resetPassword(event)" class="space-y-3.5 hidden">
            <div>
                <label class="text-xs md:text-sm text-gray-600 mb-1 block font-medium">กรอกรหัส OTP (6 หลัก)</label>
                <div class="relative">
                    <input type="text" id="otpCode" placeholder="123456" maxlength="6" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3 pl-11 text-sm tracking-widest text-center font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-green-600">
                    <i class="fa-solid fa-shield-halved absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                </div>
            </div>

            <div>
                <label class="text-xs md:text-sm text-gray-600 mb-1 block font-medium">รหัสผ่านใหม่</label>
                <div class="relative">
                    <input type="password" id="newPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3 pl-11 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-green-600">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                </div>
            </div>

            <div>
                <label class="text-xs md:text-sm text-gray-600 mb-1 block font-medium">ยืนยันรหัสผ่านใหม่</label>
                <div class="relative">
                    <input type="password" id="confirmNewPassword" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3 pl-11 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-green-600">
                    <i class="fa-solid fa-check-double absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                </div>
            </div>

            <button type="submit" class="w-full bg-[#1b5e20] text-white py-3.5 rounded-2xl font-semibold shadow-lg hover:bg-green-700 transition cursor-pointer text-sm md:text-base mt-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> บันทึกรหัสผ่านใหม่
            </button>
        </form>

        <!-- ลิงก์กลับไปหน้า Login -->
        <div class="mt-8 text-center border-t border-gray-100 pt-5">
            <p class="text-xs md:text-sm text-gray-500">
                จำรหัสผ่านได้แล้ว? 
                <a href="login.html" class="text-green-700 font-bold hover:underline ml-1">กลับไปหน้าเข้าสู่ระบบ</a>
            </p>
        </div>

    </div>

   <!-- Script ควบคุมการทำงาน 2 ขั้นตอน (จำลอง UI สำหรับเปลี่ยนรหัสผ่าน) -->
    <script src="supabase-config.js"></script>
    <script>
        let userPhone = "";

        function sendOTP(event) {
            event.preventDefault();
            userPhone = document.getElementById('resetPhone').value;
            
            if(userPhone) {
                alert(`ส่งรหัส OTP ไปยังเบอร์ ${userPhone} เรียบร้อยแล้ว (จำลอง OTP: 123456)`);
                
                // สลับแสดงฟอร์มขั้นที่ 2
                document.getElementById('step1-form').classList.add('hidden');
                document.getElementById('step2-form').classList.remove('hidden');
                document.getElementById('sub-title').innerText = `กรอกรหัส OTP และตั้งรหัสผ่านใหม่สำหรับเบอร์ ${userPhone}`;
            }
        }

        async function resetPassword(event) {
            event.preventDefault();
            const otp = document.getElementById('otpCode').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmNewPassword').value;

            if (newPass !== confirmPass) {
                alert("รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกันครับ");
                return;
            }

            if (newPass.length < 6) {
                alert("รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษรขึ้นไป");
                return;
            }

            if (otp === "123456") {
                // จำลองการทำงานสำเร็จ (ในระบบจริงของ Supabase จะใช้อีเมลในการรีเซ็ตรหัสผ่าน)
                alert("เปลี่ยนรหัสผ่านสำเร็จ! รหัสผ่านเก่าถูกยกเลิกการใช้งานแล้ว กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่");
                window.location.href = 'login.html'; 
            } else {
                alert("รหัส OTP ไม่ถูกต้อง (รหัสทดสอบคือ 123456)");
            }
        }
    </script>
</body>
</html>
